<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1b22">
<title>Mutinerie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first column — felt table (seats, piles, your seat), then your hand and actions. Single night-at-sea look. */
:root{
  --sea:#0e1b22; --deck:#15282e; --plank:#22403f; --bone:#efe6d2; --ink:#1c1a16;
  --brass:#d6a94e; --blood:#c4493e; --kelp:#7fb59a; --mist:#9db1b0;
  --felt:#1d4741; --felt-dark:#10292a; --rail:#5a3b22;
  --f-display:'Pirata One', Georgia, 'Times New Roman', serif;
  --f-body:'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--sea);color:var(--bone);margin:0}
body{font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(32px,env(safe-area-inset-bottom,0px))}
#app{max-width:760px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(3rem,14vw,4.4rem);color:var(--brass);line-height:.9}
h2{font-size:1.8rem;line-height:1.05}
p{margin:0}
b{font-weight:700}
.tag{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.muted{color:var(--mist)}
.panel{background:var(--deck);border:1px solid var(--plank);border-radius:14px;padding:18px;display:grid;gap:12px}
.btn{font:inherit;font-weight:700;padding:11px 18px;border-radius:10px;border:2px solid var(--brass);background:var(--brass);color:var(--ink);cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--brass)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
:focus-visible{outline:3px solid var(--kelp);outline-offset:2px}
form{display:grid;gap:8px}
label{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
input{font:inherit;font-size:1.05rem;padding:11px 12px;border-radius:10px;border:1px solid var(--plank);background:var(--sea);color:var(--bone);width:100%;min-width:0}
#jcode{text-transform:uppercase;letter-spacing:.3em;font-weight:700}
.err{color:var(--blood);min-height:1.2em}
.warn{border:1px solid var(--blood);border-radius:10px;padding:10px 12px}
.banner{background:var(--plank);border-radius:10px;padding:8px 12px;color:var(--bone)}

/* Lobby */
.code{font-family:var(--f-display);font-size:4rem;letter-spacing:.12em;color:var(--brass);line-height:1}
.share{display:flex;gap:8px}
.crew{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.crew li{display:flex;align-items:center;gap:8px;background:var(--sea);border-radius:8px;padding:8px 10px}

/* Table */
.bar{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mist);font-size:.9rem;font-variant-numeric:tabular-nums}
.bar b{color:var(--bone)}
.table{border-radius:30px;padding:14px 12px;background:radial-gradient(ellipse at 50% 45%,var(--felt) 0%,var(--felt-dark) 100%);
  border:7px solid var(--rail);box-shadow:inset 0 0 0 2px var(--brass),inset 0 0 50px rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.4);display:grid;gap:14px}
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px}
.seat{background:rgba(0,0,0,.25);border-radius:12px;padding:8px 10px;display:grid;gap:5px;min-width:0;border:1px solid transparent}
.seat.active{border-color:var(--brass);box-shadow:0 0 14px rgba(214,169,78,.45)}
.seat.out{opacity:.5}
.seat.me{background:rgba(0,0,0,.35)}
.who{display:flex;align-items:center;gap:6px;min-width:0}
.who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#555;flex:none}
.dot.on{background:var(--kelp)}
.coins{color:var(--brass);letter-spacing:1px;font-size:.9rem}
.coins i{font-style:normal;opacity:.28}
.pill{justify-self:start;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;padding:1px 8px;border-radius:99px;border:1px solid rgba(255,255,255,.2);color:var(--mist)}
.pill.safe{border-color:var(--kelp);color:var(--kelp)}
.pill.dead{border-color:var(--blood);color:var(--blood)}
.pill.now{border-color:var(--brass);color:var(--brass)}
.last{font-size:.8rem;color:var(--mist);min-height:1.1em}
.minis{display:flex;flex-wrap:wrap;gap:3px;min-height:42px}
.mini{width:30px;height:42px;border-radius:5px;background:var(--bone);color:var(--ink);font-family:var(--f-display);font-size:1.15rem;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.45)}
.mini.new{animation:drop .55s cubic-bezier(.2,.8,.3,1.2)}
@keyframes drop{from{transform:translateY(-34px) rotate(-14deg);opacity:0}}
.center{display:flex;justify-content:center;align-items:flex-end;gap:22px;flex-wrap:wrap;padding:4px 0}
.pile{display:grid;justify-items:center;gap:4px;font-size:.75rem;color:var(--mist);text-align:center}
.pile b{font-size:1.1rem;color:var(--bone);font-variant-numeric:tabular-nums}
.back{width:46px;height:64px;border-radius:6px;border:3px solid var(--bone);
  background:repeating-linear-gradient(45deg,var(--brass) 0 4px,#7a5a25 4px 8px)}
.back.stack{box-shadow:3px 3px 0 #c9bea6,6px 6px 0 #a39882}
.back.tilt{transform:rotate(-8deg)}
.back.tiny{width:13px;height:18px;border-width:1.5px;flex:none}

/* Hand & actions */
.secrets{border:1px dashed var(--brass);border-radius:12px;padding:10px 14px;display:grid;gap:4px}
.secrets ul{margin:0;padding-left:18px}
.secrets li:first-child{color:var(--bone);font-weight:700}
.secrets li{color:var(--mist)}
.dock{background:var(--deck);border:1px solid var(--plank);border-radius:14px;padding:14px;display:grid;gap:12px}
.prompt{font-size:1.1rem}
.prompt.mine{font-family:var(--f-display);font-size:1.7rem;color:var(--brass)}
.hand{display:flex;flex-wrap:wrap;gap:12px}
.card{width:clamp(132px,42vw,168px);min-height:214px;background:var(--bone);color:var(--ink);border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:5px;text-align:left;border:2px solid var(--bone);font:inherit;box-shadow:0 6px 18px rgba(0,0,0,.45)}
button.card{cursor:pointer;transition:transform .15s}
button.card[aria-pressed="true"]{transform:translateY(-8px);outline:3px solid var(--brass);outline-offset:2px}
.card .pic{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:7px;background:#d9cfb8}
select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--plank);background:var(--sea);color:var(--bone);min-height:44px}
.card .v{font-family:var(--f-display);font-size:2.5rem;line-height:1;color:var(--blood)}
.card .n{font-family:var(--f-display);font-size:1.4rem;line-height:1}
.card .t{font-size:.84rem;line-height:1.28}
.card .k{margin-top:auto;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:#6b6457}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;padding:9px 14px;border-radius:99px;border:1px solid var(--brass);background:transparent;color:var(--bone);cursor:pointer;min-height:40px}
.opt[aria-pressed="true"]{background:var(--brass);color:var(--ink);font-weight:700}
.reveal{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.reveal li{display:flex;gap:8px;align-items:center}
.win{font-family:var(--f-display);font-size:2.4rem;color:var(--brass);line-height:1}

details{background:var(--deck);border:1px solid var(--plank);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-family:var(--f-display);font-size:1.3rem;color:var(--brass)}
.log{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px;max-height:260px;overflow:auto}
.log li{color:var(--mist)}
.log li:first-child{color:var(--bone)}
.log li.round{font-family:var(--f-display);font-size:1.15rem;color:var(--brass);margin-top:4px}
.log li.out{color:var(--blood)}
.rules-body{display:grid;gap:10px;margin-top:10px}
.rules-body ul{margin:0;padding-left:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<template id="rulesTpl">
  <details class="rules">
    <summary>Règles du jeu</summary>
    <div class="rules-body">
      <p><b>But.</b> Gagner des doublons en remportant des manches : 6 doublons à 2 joueurs, 5 à 3 joueurs, 4 à 4 joueurs, 3 à 5 ou 6 joueurs.</p>
      <p><b>Mise en place.</b> Les 21 cartes sont mélangées. Une carte est écartée face cachée. À 2 joueurs, trois autres cartes sont écartées face visible. Chaque joueur reçoit une carte.</p>
      <p><b>Ton tour.</b> Tu pioches une carte, puis tu joues l'une de tes deux cartes et tu appliques son effet. Les cartes jouées restent visibles sur la table.</p>
      <ul>
        <li>Un joueur protégé par la carte <span data-r="4"></span> ne peut pas être ciblé.</li>
        <li>S'il n'y a aucune autre cible possible, la carte est jouée sans effet (la carte <span data-r="5"></span> doit alors te viser toi-même).</li>
        <li>Si tu as la carte <span data-r="8"></span> avec la carte <span data-r="7"></span> ou <span data-r="5"></span>, tu dois jouer la carte <span data-r="8"></span>.</li>
        <li>Un joueur qui quitte la manche révèle et défausse sa carte.</li>
      </ul>
      <p><b>Fin de manche.</b> Quand il ne reste qu'un joueur, ou quand la pioche est vide à la fin d'un tour. Les joueurs restants révèlent leur carte : la plus forte gagne. En cas d'égalité, tous les ex æquo gagnent un doublon. Si un seul joueur encore en lice a joué ou défaussé une carte <span data-r="0"></span>, il gagne en plus un doublon. Le gagnant commence la manche suivante (tirage au sort entre ex æquo). Si plusieurs joueurs atteignent le but en même temps, ils gagnent tous.</p>
      <p><b>Les 10 rôles</b></p>
      <ul id="roleList"></ul>
    </div>
  </details>
</template>

<script>
// Noms, effets et illustrations des rôles : viennent du thème choisi (serveur).
let ROLES=null;
const TARGETED=[1,2,3,5,7], GUESSABLE=[0,2,3,4,5,6,7,8,9];
const nm=v=>esc(ROLES[v].name);
const R=v=>esc(`${ROLES[v].name} (${v})`);
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} },
};
const fresh=()=>({idx:null,t:[],guess:null,flip:false});

let V=null, prev=null, sel=fresh(), es=null, busy=false, err='', conn='', homeMsg='';
let code=null, token=null, prefill='';

// ---------- Connexion ----------
function boot(){
  prefill=(new URLSearchParams(location.search).get('r')||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
  const c=prefill||store.get('mutinerie:last');
  const t=c?store.get('mutinerie:'+c):null;
  fetch('/api/themes').then(r=>r.json()).then(j=>{ if(!ROLES){ ROLES=j.themes[0].roles; render(); } }).catch(()=>{});
  if(c&&t){ code=c; token=t; connect(); } else render();
}
function enter(c,t){
  code=c; token=t;
  store.set('mutinerie:'+c,t); store.set('mutinerie:last',c);
  history.replaceState(null,'','?r='+c);
  connect();
}
function leave(msg){
  if(es){ es.close(); es=null; }
  if(code) store.set('mutinerie:'+code,null);
  store.set('mutinerie:last',null);
  prefill=''; code=null; token=null; V=null; prev=null; homeMsg=msg||'';
  history.replaceState(null,'',location.pathname);
  render();
}
const stateKey=v=>[v.phase,v.round,v.cur,v.hand.join('')].join('|');
function connect(){
  if(es) es.close();
  conn='Connexion au navire…'; render();
  es=new EventSource(`/api/events?code=${encodeURIComponent(code)}&token=${encodeURIComponent(token)}`);
  es.onmessage=e=>{
    const v=JSON.parse(e.data);
    if(!V||stateKey(V)!==stateKey(v)) sel=fresh();
    const myTurnNow=v.phase==='play'&&v.cur===v.you, myTurnBefore=V&&V.phase==='play'&&V.cur===V.you;
    if(myTurnNow&&!myTurnBefore){ try{ navigator.vibrate&&navigator.vibrate(80); }catch(x){} }
    prev=V; V=v; ROLES=v.roles; conn=''; render();
  };
  es.addEventListener('gone',()=>leave("Ce salon n'existe plus : le serveur a peut-être redémarré. Crée un nouveau salon."));
  es.onerror=()=>{ if(es&&es.readyState!==2){ conn='Connexion perdue, reconnexion…'; render(); } };
}
async function api(path,body){
  let r;
  try{ r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }
  catch(e){ throw new Error('Impossible de joindre le serveur. Vérifie ta connexion.'); }
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.error||'Le serveur ne répond pas. Réessaie.');
  return j;
}
async function send(body){
  if(busy) return;
  busy=true; err=''; render();
  try{ await api('/api/act',{code,token,...body}); }catch(e){ err=e.message; }
  busy=false; render();
}

// ---------- Rendu ----------
function card(v,tag='div',attrs=''){
  const r=ROLES[v];
  return `<${tag} class="card" ${attrs}>${r.img?`<img class="pic" src="${esc(r.img)}" alt="">`:''}<span class="v">${v}</span><span class="n">${esc(r.name)}</span><span class="t">${esc(r.txt)}</span><span class="k">${r.n} exemplaire${r.n>1?'s':''}</span></${tag}>`;
}
const mini=(v,isNew)=>`<span class="mini ${isNew?'new':''}" title="${nm(v)}" aria-label="${R(v)}">${v}</span>`;
function rules(){
  if(!ROLES) return '';
  const n=$('#rulesTpl').content.cloneNode(true);
  n.querySelectorAll('[data-r]').forEach(e=>{ e.textContent=ROLES[e.dataset.r].name; });
  n.querySelector('#roleList').innerHTML=ROLES.map((r,v)=>`<li><b>${v} · ${esc(r.name)}</b> (×${r.n}) : ${esc(r.txt)}</li>`).join('');
  const d=document.createElement('div'); d.appendChild(n); return d.innerHTML;
}

function homeHTML(){
  const name=esc(store.get('mutinerie:name')||'');
  const join=`<section class="panel"><h2>Rejoindre un salon</h2>
    <form id="joinForm"><label for="jcode">Code du salon</label><input id="jcode" maxlength="4" autocomplete="off" autocapitalize="characters" required value="${esc(prefill)}" placeholder="ABCD">
    <label for="jname">Ton nom</label><input id="jname" maxlength="20" autocomplete="nickname" required value="${name}">
    <button class="btn" type="submit">Monter à bord</button></form></section>`;
  const create=`<section class="panel"><h2>Créer un salon</h2>
    <form id="createForm"><label for="cname">Ton nom</label><input id="cname" maxlength="20" autocomplete="nickname" required value="${name}">
    <button class="btn" type="submit">Créer le salon</button></form></section>`;
  return `<section class="panel"><h1>Mutinerie</h1><p class="muted">Jeu de déduction pirate pour 2 à 6 joueurs, chacun sur son téléphone. Une carte en main, une carte piochée, une carte jouée.</p></section>
    ${homeMsg?`<p class="warn">${esc(homeMsg)}</p>`:''}
    ${prefill?join+create:create+join}
    <p class="err" id="homeErr" role="alert"></p>${rules()}`;
}

function lobbyHTML(){
  const link=`${location.origin}${location.pathname}?r=${V.code}`, n=V.players.length;
  return `<section class="panel">
    <p class="tag">Salon</p><div class="code">${esc(V.code)}</div>
    <p>Envoie ce lien à tes potes pour qu'ils montent à bord :</p>
    <div class="share"><input id="shareLink" readonly value="${esc(link)}" aria-label="Lien du salon"><button class="btn" type="button" data-act="share">Partager</button></div>
    <p class="tag">Personnages</p>
    ${V.you===0
      ? `<select id="themeSel" aria-label="Thème des personnages" ${busy?'disabled':''}>${V.themes.map(t=>`<option value="${esc(t.id)}" ${t.id===V.theme?'selected':''}>${esc(t.label)}</option>`).join('')}</select>`
      : `<p>${esc((V.themes.find(t=>t.id===V.theme)||{}).label||'')}</p>`}
    <p class="tag">Équipage (${n}/6)</p>
    <ul class="crew">${V.players.map((p,i)=>`<li><span class="dot ${p.online?'on':''}"></span>${esc(p.name)}${i===V.you?' (toi)':''}${i===0?' · capitaine':''}</li>`).join('')}</ul>
    ${V.you===0
      ? `<button class="btn" type="button" data-act="start" ${n<2||busy?'disabled':''}>Lever l'ancre</button>${n<2?'<p class="muted">Il faut au moins 2 joueurs.</p>':''}`
      : `<p class="muted">En attente que ${esc(V.players[0].name)} lance la partie.</p>`}
    <p class="err">${esc(err)}</p>
    <button class="btn ghost" type="button" data-act="leave">Quitter le salon</button>
  </section>${rules()}`;
}

function seatHTML(i){
  const p=V.players[i], isMe=i===V.you, active=(V.phase==='play'||V.phase==='carto')&&V.cur===i;
  const before=prev&&prev.round===V.round&&prev.players[i]?prev.players[i].discard.length:p.discard.length;
  const status=p.out?'<span class="pill dead">Hors manche</span>'
    :p.prot?'<span class="pill safe">À l\'abri</span>'
    :active?'<span class="pill now">Joue</span>':'';
  const last=p.discard.length?nm(p.discard[p.discard.length-1]):'';
  return `<div class="seat ${active?'active':''} ${p.out?'out':''} ${isMe?'me':''}">
    <div class="who"><span class="dot ${p.online?'on':''}" title="${p.online?'Connecté':'Déconnecté'}"></span><b>${esc(p.name)}${isMe?' (toi)':''}</b>${!p.out&&!isMe&&V.phase!=='lobby'?'<span class="back tiny" title="Une carte en main"></span>':''}</div>
    <div class="coins" aria-label="${p.tokens} doublons sur ${V.goal}">${'●'.repeat(p.tokens)}<i>${'●'.repeat(Math.max(0,V.goal-p.tokens))}</i></div>
    ${status}
    <div class="minis">${p.discard.map((v,j)=>mini(v,j>=before)).join('')}</div>
    <div class="last">${last?'Dernière : '+last:''}</div>
  </div>`;
}

function optionsHTML(){
  const v=V.hand[sel.idx], o=V.options[sel.idx], need=o.need;
  let h='';
  if(TARGETED.includes(v)&&!need) h+=`<p class="warn">Aucune cible possible : la carte sera jouée sans effet.</p>`;
  if(need){
    h+=`<p class="tag">Choisis une cible</p><div class="opts">${o.targets.map(i=>
      `<button class="opt" type="button" data-act="tgt" data-i="${i}" aria-pressed="${sel.t.includes(i)}">${esc(V.players[i].name)}${i===V.you?' (toi)':''}</button>`).join('')}</div>`;
  }
  if(v===1&&need){
    h+=`<p class="tag">Quel rôle accuses-tu ?</p><div class="opts">${GUESSABLE.map(g=>
      `<button class="opt" type="button" data-act="guess" data-i="${g}" aria-pressed="${sel.guess===g}">${R(g)}</button>`).join('')}</div>`;
  }
  if(v===9) h+=`<p class="warn">Jouer ${nm(9)} te fait quitter la manche.</p>`;
  const ok=sel.t.length===need&&(v!==1||!need||sel.guess!=null);
  return h+`<div class="row"><button class="btn" type="button" data-act="play" ${ok&&!busy?'':'disabled'}>Jouer ${nm(v)}</button></div>`;
}

function dockHTML(){
  const me=V.players[V.you], curName=esc(V.players[V.cur].name);
  const myHand=me.out?`<p class="warn">Tu as quitté cette manche. Suis la suite sur la table.</p>`:`<p class="tag">Ta main</p><div class="hand">${V.hand.map(v=>card(v)).join('')}</div>`;
  switch(V.phase){
    case 'play':
      if(V.cur===V.you) return `<p class="prompt mine">À toi de jouer !</p><p class="muted">Touche la carte que tu veux jouer.</p>
        <div class="hand">${V.hand.map((v,i)=>card(v,'button',`type="button" data-act="pick" data-i="${i}" aria-pressed="${sel.idx===i}" ${V.options[i].locked?'disabled':''}`)).join('')}</div>
        ${V.options.some(o=>o.locked)?`<p class="warn">Avec ${nm(7)} ou ${nm(5)} en main, tu dois jouer ${nm(8)}.</p>`:''}
        ${sel.idx!=null?optionsHTML():''}`;
      return `<p class="prompt">Au tour de <b>${curName}</b>…</p>${myHand}`;
    case 'carto':
      if(V.cur===V.you){
        const rest=V.hand.map((v,i)=>i).filter(i=>i!==sel.idx);
        if(sel.flip) rest.reverse();
        return `<p class="prompt mine">${nm(6)}</p><p class="muted">Touche la carte que tu gardes. Les autres iront sous la pioche.</p>
        <div class="hand">${V.hand.map((v,i)=>card(v,'button',`type="button" data-act="pick" data-i="${i}" aria-pressed="${sel.idx===i}"`)).join('')}</div>
        ${sel.idx!=null&&rest.length?`<p class="tag">Sous la pioche, de haut en bas</p><p>${rest.map(i=>R(V.hand[i])).join(' puis ')}</p>`:''}
        <div class="row">${sel.idx!=null&&rest.length>1?`<button class="btn ghost" type="button" data-act="flip">Inverser l'ordre</button>`:''}
          <button class="btn" type="button" data-act="carto" ${sel.idx!=null&&!busy?'':'disabled'}>Valider</button></div>`;
      }
      return `<p class="prompt"><b>${curName}</b> consulte la pioche…</p>${myHand}`;
    case 'roundEnd': case 'over': {
      const r=V.result, many=r.winners.length>1;
      const champs=V.players.filter(q=>q.tokens>=V.goal).map(q=>esc(q.name));
      return `<p class="tag">Fin de la manche ${V.round}</p>
        <h2>${r.winners.map(esc).join(' et ')} ${many?'remportent':'remporte'} un doublon</h2>
        <p>${esc(r.why)}</p>${r.rat?`<p>${esc(r.rat)} gagne aussi un doublon : seul joueur en lice avec une carte ${nm(0)}.</p>`:''}
        <ul class="reveal">${r.hands.map(h=>`<li>${h.card!=null?mini(h.card):'<span class="mini">–</span>'} ${esc(h.name)} · ${h.card!=null?nm(h.card):'hors manche'}</li>`).join('')}
          <li>${r.aside!=null?mini(r.aside)+' Carte écartée · '+nm(r.aside):'La carte écartée avait été piochée.'}</li></ul>
        ${V.phase==='over'
          ? `<p class="win">${champs.join(' et ')} ${champs.length>1?'gagnent':'gagne'} la partie !</p>
             <div class="row"><button class="btn" type="button" data-act="again" ${busy?'disabled':''}>Rejouer avec le même équipage</button><button class="btn ghost" type="button" data-act="leave">Quitter</button></div>`
          : `<div class="row"><button class="btn" type="button" data-act="next" ${busy?'disabled':''}>Manche suivante</button></div>`}`;
    }
  }
  return '';
}

function gameHTML(){
  const n=V.players.length, others=[];
  for(let k=1;k<n;k++) others.push((V.you+k)%n);
  return `<div class="bar"><span>Salon <b>${esc(V.code)}</b></span><span>Manche <b>${V.round}</b></span><span><b>${V.goal}</b> doublons pour gagner</span></div>
    ${conn?`<p class="banner">${esc(conn)}</p>`:''}
    <section class="table" aria-label="Table de jeu">
      <div class="seats">${others.map(seatHTML).join('')}</div>
      <div class="center">
        <div class="pile"><div class="back stack"></div><b>${V.deck}</b>pioche</div>
        ${V.asideHidden?`<div class="pile"><div class="back tilt"></div>écartée</div>`:''}
        ${V.faceUp.length?`<div class="pile"><div class="minis">${V.faceUp.map(v=>mini(v)).join('')}</div>visibles</div>`:''}
      </div>
      ${seatHTML(V.you)}
    </section>
    ${V.inbox.length?`<section class="secrets"><span class="tag">Tes secrets · toi seul les vois</span><ul>${V.inbox.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>`:''}
    <section class="dock">${dockHTML()}${err?`<p class="err">${esc(err)}</p>`:''}</section>
    <details class="logbox" open><summary>Journal de bord</summary><ol class="log">${V.log.map(l=>`<li class="${l.k}">${esc(l.t)}</li>`).join('')}</ol></details>
    ${rules()}
    <div class="row"><button class="btn ghost" type="button" data-act="leave">Quitter la partie</button></div>`;
}

function render(){
  document.title=V&&V.phase==='play'&&V.cur===V.you?'À toi ! · Mutinerie':'Mutinerie';
  if(!code||!token){ app.innerHTML=homeHTML(); return; }
  if(!V){ app.innerHTML=`<section class="panel"><p>${esc(conn||'Connexion…')}</p><p class="muted">Le premier chargement peut prendre une minute si le serveur dormait.</p><button class="btn ghost" type="button" data-act="leave">Revenir à l'accueil</button></section>`; return; }
  const openLog=document.querySelector('details.logbox');
  const logOpen=openLog?openLog.open:true;
  app.innerHTML=V.phase==='lobby'?lobbyHTML():gameHTML();
  const lb=document.querySelector('details.logbox'); if(lb) lb.open=logOpen;
}

// ---------- Interactions ----------
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const i=+b.dataset.i;
  switch(b.dataset.act){
    case 'pick': sel={...fresh(),idx:i}; break;
    case 'tgt': sel.t=[i]; break;
    case 'guess': sel.guess=i; break;
    case 'flip': sel.flip=!sel.flip; break;
    case 'carto': return send({type:'carto',keep:sel.idx,flip:sel.flip});
    case 'play': return send({type:'play',idx:sel.idx,targets:sel.t,guess:sel.guess});
    case 'start': case 'next': case 'again': return send({type:b.dataset.act});
    case 'leave': return leave();
    case 'share': {
      const link=$('#shareLink').value;
      if(navigator.share){ navigator.share({title:'Mutinerie',text:'Monte à bord de ma partie de Mutinerie !',url:link}).catch(()=>{}); return; }
      if(navigator.clipboard) navigator.clipboard.writeText(link).then(()=>{ b.textContent='Copié !'; },()=>$('#shareLink').select());
      else $('#shareLink').select();
      return;
    }
  }
  render();
});
app.addEventListener('change',e=>{ if(e.target.id==='themeSel') send({type:'theme',id:e.target.value}); });
app.addEventListener('submit',async e=>{
  e.preventDefault();
  if(busy) return;
  const f=e.target, out=$('#homeErr');
  busy=true; out.textContent='';
  try{
    if(f.id==='createForm'){
      const name=$('#cname').value.trim(); store.set('mutinerie:name',name);
      const j=await api('/api/create',{name}); enter(j.code,j.token);
    } else {
      const name=$('#jname').value.trim(); store.set('mutinerie:name',name);
      const j=await api('/api/join',{code:$('#jcode').value.trim(),name}); enter(j.code,j.token);
    }
  }catch(x){ out.textContent=x.message; }
  busy=false;
});

boot();
</script>
</body>
</html>
